# Keeps the calendar topped up.
#
# Only ever deals days that do not exist yet. Regenerating a day that already
# shipped would be a quiet way to break it: puzzles are seeded off the date
# ordinal so the same engine reproduces the same day byte for byte, but the
# moment a rule or a data table changes, a regenerated past day becomes a
# *different* puzzle -- and a save whose target no longer matches is discarded,
# so anyone mid-game that day loses it. Past days are history; only the future
# is generated.
#
# A month ahead, topped up weekly. The horizon is short on purpose: every day
# dealt is a day committed, and the moment a rule or table changes, everything
# already dealt is frozen as-is or breaks someone's save. A month is enough
# runway to survive three missed runs and small enough that an engine change
# only locks in a few weeks.
#
# Weekly rather than daily: each run adds about seven days, so a daily job
# would mostly be a commit and a redeploy that added nothing.
#
# It also prunes. The picker refuses to repeat a target the last two months
# used, which means it has to be able to read those two months, and means the
# months before them are of no use to anybody: the front end serves one day and
# has no archive. So the same window that stops a repeat is the window that
# decides what gets deleted, and both live in `chem.puzzle.RECENT_DAYS`.

name: generate puzzles

on:
  schedule:
    # 03:00 UTC on Mondays. Nothing depends on the hour or the day -- with a
    # month of runway this job is never the reason tomorrow has a puzzle.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      horizon:
        description: "Deal puzzles this many days ahead of today"
        required: false
        default: "30"

concurrency:
  group: generate-puzzles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Work out which days are missing
        id: range
        run: |
          set -euo pipefail
          horizon="${{ github.event.inputs.horizon || '30' }}"

          last=$(ls frontend/public/puzzles/*.json 2>/dev/null \
                 | xargs -r -n1 basename \
                 | sed 's/\.json$//' \
                 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
                 | sort | tail -1 || true)

          if [ -z "$last" ]; then
            start=$(date -u +%F)
          else
            start=$(date -u -d "$last + 1 day" +%F)
          fi
          end=$(date -u -d "+$horizon days" +%F)

          days=$(( ( $(date -u -d "$end" +%s) - $(date -u -d "$start" +%s) ) / 86400 + 1 ))
          if [ "$days" -le 0 ]; then
            # Still runs, with nothing to deal. Pruning is this job's other half
            # and a full calendar is exactly when there is old material to drop.
            echo "calendar already reaches $last, nothing to deal"
            days=0
            start=$(date -u +%F)
          else
            echo "dealing $days days from $start (last on disk: ${last:-none})"
          fi
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"

      # `--prune` deletes bundles more than two months old, which is the same
      # window the picker reads to avoid repeating a target -- see RECENT_DAYS.
      # They have to be one number: a day can only avoid what it can still read.
      # Nothing else reads an old bundle. The front end serves one day, the most
      # recent that is not in the future, and has no archive; git keeps the rest.
      - name: Deal them, and drop what has fallen out of the window
        working-directory: backend
        run: uv run python -m chem.puzzle "${{ steps.range.outputs.start }}" --days "${{ steps.range.outputs.days }}" --prune

      # The generator now writes the index from the directory itself, so this is
      # no longer the only thing standing between a one-day run and a truncated
      # calendar. It stays because it is the *independent* check: it imports
      # nothing from `chem` and re-derives every day's winnability from the
      # shipped JSON, so a generator bug cannot vouch for itself.
      - name: Rebuild the index and check every bundle
        run: python backend/verify_bundles.py --reindex

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A, because this job deletes as well as writes and a bare `git add`
          # of a pathspec has not always staged removals.
          git add -A frontend/public/puzzles
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore(puzzles): deal through $(date -u -d "+${{ github.event.inputs.horizon || '30' }} days" +%F), prune past two months"
          git push
